<!DOCTYPE html>
<html
  lang="en"
  x-data="{ darkMode: localStorage.getItem('darkMode') === 'true' }"
  :class="{ 'dark': darkMode }"
>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Family Loan Tracker – Admin Login" />
  <title>Admin Login – Loan Tracker</title>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'system-ui', 'sans-serif'],
            mono: ['DM Mono', 'Fira Code', 'monospace'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine.js 3.x -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/payment/css/app.css" />
</head>

<body class="min-h-screen flex items-center justify-center px-4" style="background-color: var(--bg-base); color: var(--text-primary);">

  <div x-data="login" class="w-full max-w-sm fade-up">

    <!-- Logo mark -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center shadow-lg mb-4"
           style="box-shadow: 0 8px 24px rgba(99,102,241,0.4)">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
      </div>
      <h1 class="text-xl font-semibold tracking-tight" style="color: var(--text-primary)">Admin Login</h1>
      <p class="text-sm mt-1" style="color: var(--text-muted)">Family Loan Tracker</p>
    </div>

    <!-- Login card -->
    <div class="card p-6 space-y-4">

      <!-- Error message -->
      <div
        x-show="error"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 -translate-y-1"
        x-transition:enter-end="opacity-100 translate-y-0"
        class="error-card"
        role="alert"
        x-text="error"
      ></div>

      <!-- Password field -->
      <div>
        <label for="password" class="section-heading block mb-2">Password</label>
        <input
          id="password"
          type="password"
          x-model="password"
          @keydown.enter="submit"
          placeholder="Enter admin password"
          autocomplete="current-password"
          class="pay-input"
          style="font-family: var(--font-sans); font-size: 1rem;"
          :disabled="loading"
          autofocus
        />
      </div>

      <!-- Submit button -->
      <button
        @click="submit"
        :disabled="loading || !password"
        class="btn-primary"
      >
        <span x-show="!loading">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
          </svg>
        </span>
        <span x-show="loading">
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </span>
        <span x-text="loading ? 'Signing in…' : 'Login'"></span>
      </button>

    </div>

    <!-- Back link -->
    <div class="text-center mt-5">
      <a href="/payment/" class="text-sm transition-colors hover:opacity-80" style="color: var(--text-muted)">
        &larr; Back to Dashboard
      </a>
    </div>

  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('login', () => ({
        password: '',
        error: '',
        loading: false,
        async submit() {
          if (!this.password || this.loading) return;
          this.loading = true;
          this.error = '';
          try {
            const res = await fetch('/payment/api/admin/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: this.password })
            });
            const data = await res.json();
            if (res.ok) window.location.href = '/payment/admin/';
            else this.error = data.error || 'Invalid password';
          } catch {
            this.error = 'Login failed. Please try again.';
          }
          this.loading = false;
        }
      }));
    });
  </script>

</body>
</html>
