<!DOCTYPE html>
<html
  lang="en"
  x-data
  :class="{ 'dark': localStorage.getItem('darkMode') === 'true' }"
>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Family Loan Tracker – Payment Calculator & Prediction" />
  <title>Calculator – Family Loan Tracker</title>

  <!-- Tailwind Play CDN -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'system-ui', 'sans-serif'],
            mono: ['DM Mono', 'Fira Code', 'monospace'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js 4.x -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- Alpine.js 3.x (defer so DOM is ready) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Custom CSS (shared) -->
  <link rel="stylesheet" href="/payment/css/app.css" />

  <!-- Calculator Alpine component (must load before alpine:init) -->
  <script src="/payment/js/calculator.js"></script>

  <style>
    /* ── Range slider ──────────────────────────────────────── */
    .calc-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .calc-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #6366f1;
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.45);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .calc-slider::-webkit-slider-thumb:hover,
    .calc-slider:focus::-webkit-slider-thumb {
      transform: scale(1.18);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.55);
    }

    .calc-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #6366f1;
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.45);
      cursor: pointer;
    }

    /* Fill track left of thumb via JS-set background-size */
    .calc-slider-filled {
      background: linear-gradient(
        to right,
        #6366f1 var(--fill-pct, 0%),
        var(--border) var(--fill-pct, 0%)
      );
    }

    /* ── Lump sum reveal ──────────────────────────────────── */
    .lump-reveal {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.25s ease,
                  margin-top 0.25s ease;
      margin-top: 0;
    }
    .lump-reveal.open {
      max-height: 100px;
      opacity: 1;
      margin-top: 0.75rem;
    }

    /* ── Result row ───────────────────────────────────────── */
    .result-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.25rem;
      padding: 0.625rem 0;
      border-bottom: 1px solid var(--border);
    }
    .result-row:last-child { border-bottom: none; }

    .result-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .result-value {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* ── Preset buttons ───────────────────────────────────── */
    .preset-btn {
      padding: 0.375rem 0.875rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .preset-btn:hover,
    .preset-btn.active {
      border-color: #6366f1;
      color: #6366f1;
      background: rgba(99, 102, 241, 0.07);
    }

    .dark .preset-btn.active {
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.14);
      border-color: #a5b4fc;
    }

    /* ── Amortization table ───────────────────────────────── */
    .amort-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      table-layout: auto;
    }

    @media (max-width: 640px) {
      .amort-table { font-size: 0.72rem; }
      .amort-table thead th { padding: 0.375rem 0.375rem; font-size: 0.65rem; }
      .amort-table tbody td { padding: 0.375rem 0.375rem; }
      .amort-table .mono-cell { font-size: 0.7rem; }
    }

    .amort-table thead th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    .amort-table tbody tr:nth-child(even) {
      background: rgba(99, 91, 255, 0.03);
    }

    .dark .amort-table tbody tr:nth-child(even) {
      background: rgba(99, 91, 255, 0.06);
    }

    .amort-table tbody td {
      padding: 0.5rem 0.75rem;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
    }

    .amort-table tbody tr:last-child td {
      border-bottom: none;
    }

    .amort-table .mono-cell {
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    /* ── Savings badge ────────────────────────────────────── */
    .savings-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(34, 197, 94, 0.10);
      color: #16a34a;
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 0.5rem;
      padding: 0.25rem 0.625rem;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: var(--font-mono);
    }

    .dark .savings-badge {
      background: rgba(74, 222, 128, 0.10);
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.20);
    }

    /* ── Warning badge ────────────────────────────────────── */
    .warn-badge {
      background: rgba(245, 158, 11, 0.10);
      color: #b45309;
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 0.625rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .dark .warn-badge {
      background: rgba(251, 191, 36, 0.10);
      color: #fcd34d;
      border-color: rgba(252, 211, 77, 0.20);
    }

    /* ── Show more button ─────────────────────────────────── */
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 0.625rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .btn-ghost:hover {
      border-color: #6366f1;
      color: #6366f1;
    }
  </style>
</head>

<body class="min-h-screen overflow-x-hidden" style="background-color: var(--bg-base); color: var(--text-primary);">

  <div
    x-data="calculator"
    class="flex min-h-screen"
  >

    <!-- ── SIDEBAR (desktop only) ─────────────────────────────── -->
    <aside class="sidebar hidden lg:flex flex-col w-60 shrink-0 fixed top-0 left-0 h-full z-30 px-4 py-6">

      <!-- Logo / brand -->
      <div class="flex items-center gap-3 px-2 mb-8">
        <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center shrink-0">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
        </div>
        <div>
          <div class="text-sm font-semibold leading-tight" style="color: var(--text-primary)">Level Up</div>
          <div class="text-xs" style="color: var(--text-muted)">Loan Tracker</div>
        </div>
      </div>

      <!-- Nav links -->
      <nav class="flex flex-col gap-1 flex-1">
        <a href="/payment/" class="nav-link">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
          </svg>
          Dashboard
        </a>
        <a href="/payment/payments" class="nav-link">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25Z" />
          </svg>
          Payments
        </a>
        <a href="/payment/calculator" class="nav-link active">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 15.75V18m-7.5-6.75h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25V13.5Zm0 2.25h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25V18Zm2.498-6.75h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V13.5Zm0 2.25h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V18Zm2.504-6.75h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V13.5Zm0 2.25h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V18Zm2.498-6.75h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V13.5ZM8.25 6h7.5v2.25h-7.5V6ZM12 2.25c-1.892 0-3.758.11-5.593.322C5.307 2.7 4.5 3.65 4.5 4.757V19.5a2.25 2.25 0 0 0 2.25 2.25h10.5a2.25 2.25 0 0 0 2.25-2.25V4.757c0-1.108-.806-2.057-1.907-2.185A48.507 48.507 0 0 0 12 2.25Z" />
          </svg>
          Calculator
        </a>
        <a href="/payment/admin/" class="nav-link">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
          Admin
        </a>
      </nav>

      <!-- Dark mode toggle (sidebar bottom) -->
      <div class="mt-auto pt-4 border-t" style="border-color: var(--border)">
        <button
          @click="document.documentElement.classList.toggle('dark'); localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'))"
          class="w-full flex items-center gap-3 px-2 py-2 rounded-lg text-sm font-medium transition-colors hover:opacity-80"
          style="color: var(--text-muted)"
          aria-label="Toggle dark mode"
        >
          <span x-show="!document.documentElement.classList.contains('dark')" class="text-base">🌙</span>
          <span x-show="document.documentElement.classList.contains('dark')"  class="text-base">☀️</span>
          <span x-text="document.documentElement.classList.contains('dark') ? 'Light mode' : 'Dark mode'"></span>
        </button>
      </div>
    </aside>

    <!-- ── MAIN CONTENT ──────────────────────────────────────── -->
    <main class="flex-1 lg:ml-60 pb-24 lg:pb-8">
      <div class="px-4 pt-5 lg:px-6 lg:pt-6 max-w-4xl mx-auto space-y-5 overflow-x-hidden">

        <!-- ── HEADER ──────────────────────────────────────────── -->
        <header class="flex items-center justify-between fade-up">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight" style="color: var(--text-primary)">
              Calculator
            </h1>
            <p class="text-sm mt-0.5" style="color: var(--text-muted)">
              See how different payment amounts affect your payoff date
            </p>
          </div>

          <!-- Dark mode toggle (mobile) -->
          <button
            @click="document.documentElement.classList.toggle('dark'); localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'))"
            class="lg:hidden flex items-center justify-center w-10 h-10 rounded-xl border transition-colors"
            style="border-color: var(--border); background: var(--bg-card)"
            aria-label="Toggle dark mode"
          >
            <span x-show="!document.documentElement.classList.contains('dark')" class="text-lg">🌙</span>
            <span x-show="document.documentElement.classList.contains('dark')"  class="text-lg">☀️</span>
          </button>
        </header>

        <!-- ── LOADING ─────────────────────────────────────────── -->
        <div x-show="loading" class="space-y-4">
          <div class="card p-5">
            <div class="skeleton h-3 w-32 mb-4 rounded"></div>
            <div class="skeleton h-7 w-48 mb-2 rounded"></div>
            <div class="skeleton h-3 w-56 rounded"></div>
          </div>
          <div class="card p-5">
            <div class="skeleton h-12 w-36 mx-auto mb-6 rounded"></div>
            <div class="skeleton h-6 w-full rounded-full"></div>
          </div>
        </div>

        <!-- ── ERROR ───────────────────────────────────────────── -->
        <div x-show="error && !loading">
          <div class="error-card">
            <strong>Error:</strong> <span x-text="error"></span>
            <button @click="fetchStatus()" class="ml-3 underline text-sm">Retry</button>
          </div>
        </div>

        <!-- ── CONTENT (loaded) ────────────────────────────────── -->
        <template x-if="!loading && !error">
          <div class="space-y-5">

            <!-- ── 1. CURRENT STATUS CARD ──────────────────────── -->
            <div class="card p-5 fade-up fade-up-1">
              <p class="section-heading mb-3">Current Status</p>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
                <div>
                  <p class="text-xs font-medium mb-1" style="color: var(--text-muted)">Outstanding</p>
                  <p class="font-mono font-medium text-indigo-600 dark:text-indigo-400"
                     style="font-size: 1.25rem; letter-spacing: -0.02em"
                     x-text="formatCurrency(balance)"></p>
                </div>
                <div>
                  <p class="text-xs font-medium mb-1" style="color: var(--text-muted)">Annual Rate</p>
                  <p class="font-mono font-medium" style="font-size: 1.25rem; letter-spacing: -0.02em; color: var(--text-primary)"
                     x-text="(annualRate * 100).toFixed(1) + '%'"></p>
                </div>
                <div>
                  <p class="text-xs font-medium mb-1" style="color: var(--text-muted)">Started</p>
                  <p class="font-mono font-medium" style="font-size: 1.25rem; letter-spacing: -0.02em; color: var(--text-primary)"
                     x-text="startDate ? new Date(startDate).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }) : '—'"></p>
                </div>
              </div>

              <!-- Current pace projection -->
              <div
                x-show="currentPaceResult && currentPaceResult.payoffDate"
                class="mt-4 pt-4 border-t flex items-center gap-2 text-sm"
                style="border-color: var(--border)"
              >
                <svg class="w-4 h-4 shrink-0" style="color: var(--text-muted)" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
                </svg>
                <span style="color: var(--text-muted)">
                  Based on your current pace of
                  <strong class="font-mono" style="color: var(--text-primary)" x-text="formatCurrency(currentPacePayment)"></strong>/month,
                  you'll pay off by
                  <strong style="color: var(--text-primary)" x-text="currentPaceResult ? formatMonthYear(currentPaceResult.payoffDate) : '—'"></strong>.
                </span>
              </div>
            </div>

            <!-- ── 2. SLIDER SECTION ───────────────────────────── -->
            <div class="card p-5 fade-up fade-up-2">

              <p class="section-heading mb-1">What if I pay...</p>

              <!-- Large value display -->
              <div class="flex items-end justify-between mb-5">
                <p
                  class="font-mono font-semibold leading-none tracking-tight"
                  style="font-size: clamp(1.75rem, 8vw, 2.75rem); color: #6366f1; letter-spacing: -0.04em"
                  x-text="sliderDisplay"
                ></p>
                <span class="text-sm font-medium pb-1" style="color: var(--text-muted)">/ month</span>
              </div>

              <!-- Slider -->
              <div class="mb-5">
                <input
                  type="range"
                  class="calc-slider calc-slider-filled"
                  :min="sliderMin"
                  :max="sliderMax"
                  :step="sliderStep"
                  x-model.number="sliderValue"
                  @input="onSliderInput(); $el.style.setProperty('--fill-pct', ((sliderValue - sliderMin) / (sliderMax - sliderMin) * 100) + '%')"
                  x-init="$el.style.setProperty('--fill-pct', ((sliderValue - sliderMin) / (sliderMax - sliderMin) * 100) + '%')"
                  aria-label="Monthly payment amount"
                />
                <div class="flex justify-between mt-1.5">
                  <span class="text-xs font-mono" style="color: var(--text-muted)">£50</span>
                  <span class="text-xs font-mono" style="color: var(--text-muted)">£2,000</span>
                </div>
              </div>

              <!-- Preset quick buttons -->
              <div class="flex flex-wrap gap-2" role="group" aria-label="Preset amounts">
                <template x-for="preset in [100, 200, 500, 1000]" :key="preset">
                  <button
                    @click="setPreset(preset); $el.closest('.card').querySelector('input[type=range]').style.setProperty('--fill-pct', ((preset - sliderMin) / (sliderMax - sliderMin) * 100) + '%')"
                    class="preset-btn"
                    :class="{ 'active': sliderValue === preset }"
                    :aria-pressed="sliderValue === preset"
                    x-text="'£' + preset.toLocaleString('en-GB')"
                  ></button>
                </template>
              </div>

              <!-- Lump Sums Section -->
              <div class="mt-5 pt-4 border-t" style="border-color: var(--border)">
                <div class="flex items-center justify-between">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" x-model="showLumpSums" @change="if(!showLumpSums) { lumpSums = []; recalculate(); }"
                      class="w-4 h-4 rounded" style="accent-color: #6366f1" />
                    <span class="text-sm font-medium" style="color: var(--text-primary)">Include one-off lump sum payments</span>
                  </label>
                </div>

                <div x-show="showLumpSums" x-transition class="space-y-3 mt-3">
                  <!-- Existing lump sums -->
                  <template x-for="ls in lumpSums" :key="ls.id">
                    <div class="flex items-end gap-2 flex-wrap p-3 rounded-lg" style="background: var(--bg-base); border: 1px solid var(--border);">
                      <div class="flex-1" style="min-width: 120px">
                        <label class="text-xs font-medium block mb-1" style="color: var(--text-muted)">Amount</label>
                        <div class="relative">
                          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm font-mono" style="color: var(--text-muted)">£</span>
                          <input type="number" min="1" step="1" class="pay-input pl-7 text-sm w-full" placeholder="0"
                            x-model="ls.amount" @input="recalculate()" />
                        </div>
                      </div>
                      <div class="flex-1" style="min-width: 140px">
                        <label class="text-xs font-medium block mb-1" style="color: var(--text-muted)">Date</label>
                        <input type="date" class="pay-input text-sm w-full" x-model="ls.date" @change="updateLumpSumOffset(ls)" />
                      </div>
                      <button @click="removeLumpSum(ls.id)" class="text-xs px-2 py-2 rounded-lg transition-colors shrink-0"
                        style="color: var(--text-muted)" title="Remove">&#10005;</button>
                    </div>
                  </template>

                  <!-- Add another button -->
                  <button @click="addLumpSum()" class="text-xs font-medium px-3 py-2 rounded-lg transition-colors w-full text-center"
                    style="color: #6366f1; background: rgba(99,102,241,0.08); border: 1px dashed rgba(99,102,241,0.3);">
                    + Add lump sum payment
                  </button>
                </div>
              </div>

            </div>

            <!-- ── 3. LIVE RESULTS ─────────────────────────────── -->
            <div class="card p-5 fade-up fade-up-3">
              <p class="section-heading mb-3">Results</p>

              <!-- Warning: payment too low -->
              <div x-show="payoffTooLong" class="warn-badge mb-4">
                Monthly payment is too low to cover interest — increase it to see a payoff date.
              </div>

              <!-- Results grid -->
              <div x-show="!payoffTooLong && result">

                <!-- Payoff date (hero) -->
                <div class="mb-5 pb-5 border-b" style="border-color: var(--border)">
                  <p class="text-xs font-semibold uppercase tracking-widest mb-1" style="color: var(--text-muted)">Payoff date</p>
                  <p
                    class="font-mono font-semibold leading-tight"
                    style="font-size: clamp(1.5rem, 6vw, 2rem); letter-spacing: -0.03em; color: var(--text-primary)"
                    x-text="result ? formatMonthYear(result.payoffDate) : '—'"
                  ></p>
                  <p
                    class="text-sm mt-0.5"
                    style="color: var(--text-muted)"
                    x-text="result && result.payoffDate ? monthsFromNowLabel(result.payoffDate) : ''"
                  ></p>
                </div>

                <!-- Stat rows -->
                <div>
                  <div class="result-row">
                    <span class="result-label">Total interest you'll pay</span>
                    <span class="result-value text-amber-600 dark:text-amber-400"
                          x-text="result ? formatCurrency(result.totalInterest) : '—'"></span>
                  </div>

                  <div class="result-row">
                    <span class="result-label">Interest saved vs current pace</span>
                    <span>
                      <template x-if="interestSaved !== null && interestSaved > 0">
                        <span class="savings-badge">
                          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5 12 21m0 0-7.5-7.5M12 21V3" />
                          </svg>
                          <span x-text="formatCurrency(interestSaved)"></span>
                        </span>
                      </template>
                      <template x-if="interestSaved === null || interestSaved <= 0">
                        <span class="result-value" style="color: var(--text-muted)">—</span>
                      </template>
                    </span>
                  </div>

                  <div class="result-row">
                    <span class="result-label">Months saved</span>
                    <span>
                      <template x-if="monthsSaved !== null && monthsSaved > 0">
                        <span class="result-value text-green-600 dark:text-green-400"
                              x-text="formatMonths(monthsSaved)"></span>
                      </template>
                      <template x-if="monthsSaved === null || monthsSaved <= 0">
                        <span class="result-value" style="color: var(--text-muted)">—</span>
                      </template>
                    </span>
                  </div>

                  <div class="result-row">
                    <span class="result-label">Total payments</span>
                    <span class="result-value" x-text="result ? formatMonths(result.months) : '—'"></span>
                  </div>
                </div>

              </div>
            </div>

            <!-- ── 4. PROJECTION CHART ─────────────────────────── -->
            <div class="card p-5 fade-up fade-up-4">
              <p class="section-heading mb-4">Balance projection</p>
              <div class="chart-wrap" style="min-height: 260px">
                <canvas id="calc-projection-chart" aria-label="Balance projection chart"></canvas>
              </div>
            </div>

            <!-- ── 5. AMORTIZATION TABLE ───────────────────────── -->
            <div
              x-show="result && result.snapshots && result.snapshots.length > 0"
              class="card fade-up fade-up-5"
            >
              <div class="p-5 pb-3 flex items-center justify-between">
                <p class="section-heading mb-0">Amortization schedule</p>
                <span
                  class="text-xs font-mono"
                  style="color: var(--text-muted)"
                  x-text="showFullTable ? 'All ' + (result ? result.snapshots.length : 0) + ' months' : 'First 12 months'"
                ></span>
              </div>

              <div class="overflow-x-auto">
                <table class="amort-table" aria-label="Amortization schedule">
                  <thead>
                    <tr>
                      <th>Month</th>
                      <th>Date</th>
                      <th>Payment</th>
                      <th>Interest</th>
                      <th>Principal</th>
                      <th>Balance</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="(row, idx) in tableRows" :key="idx">
                      <tr>
                        <td class="mono-cell" x-text="row.month"></td>
                        <td x-text="rowDate(row)"></td>
                        <td class="mono-cell">
                          <span x-text="formatCurrency(row.payment)"></span>
                          <span x-show="row.lumpSum" class="text-xs ml-1" style="color: #6366f1">(inc. lump sum)</span>
                        </td>
                        <td class="mono-cell text-amber-600 dark:text-amber-400" x-text="formatCurrency(row.interest)"></td>
                        <td class="mono-cell text-indigo-600 dark:text-indigo-400" x-text="formatCurrency(row.principal)"></td>
                        <td class="mono-cell font-semibold" x-text="formatCurrency(row.balance)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <!-- Show full / collapse button -->
              <div
                x-show="result && result.snapshots && result.snapshots.length > 12"
                class="p-4 pt-3 flex justify-center border-t"
                style="border-color: var(--border)"
              >
                <button
                  class="btn-ghost"
                  @click="showFullTable = !showFullTable"
                  :aria-expanded="showFullTable"
                >
                  <svg
                    class="w-4 h-4 transition-transform duration-200"
                    :class="{ 'rotate-180': showFullTable }"
                    fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                    aria-hidden="true"
                  >
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                  </svg>
                  <span x-text="showFullTable ? 'Collapse schedule' : 'Show full schedule'"></span>
                </button>
              </div>
            </div>

            <!-- Footer -->
            <footer class="text-center py-4">
              <p class="text-xs" style="color: var(--text-muted)">
                leveluplanguage.co.uk &middot; Family Loan Tracker
              </p>
            </footer>

          </div><!-- /template x-if -->
        </template>

      </div>
    </main>

  </div><!-- /x-data="calculator" -->
